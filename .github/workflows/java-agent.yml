name: Java agent

# Wirescry's Java agent (native/java-agent) on every Java GitHub's images carry, plus 8 on Linux,
# loaded at startup and attached, on each OS. Attaching takes a JDK on Wirescry's side; nightly
# runs try JDK 11, 21 and 25 as the attacher against every target, pull requests JDK 21.

on:
  pull_request:
    paths:
      - native/java-agent/**
      - src/backend/java/**
      - scripts/build-java-agent.mjs
      - test/java-agent*.ts
      - test/java/**
      - package.json
      - vitest.config.mts
      - .github/workflows/java-agent.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Java versions (${{ matrix.os }}, attacher JDK ${{ matrix.attacher }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        attacher: ${{ fromJSON(github.event_name == 'pull_request' && '["21"]' || '["11","21","25"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Byte Buddy, which the agent's build fetches from Maven Central and checks by its pinned
      # SHA-256 (scripts/build-java-agent.mjs): fetched once, not by every job.
      - uses: actions/cache@v6
        with:
          path: native/java-agent/deps
          key: byte-buddy-${{ hashFiles('scripts/build-java-agent.mjs') }}
      # Ubuntu's image no longer carries Java 8, which programs still run on.
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '8'
      - name: Find the JDKs
        shell: bash
        env:
          ATTACHER: ${{ matrix.attacher }}
        run: |
          # The images name each JDK JAVA_HOME_<major>_<arch>. Build with 21; run on all of them.
          exe=java; [ "$RUNNER_OS" = Windows ] && exe=java.exe
          delim=:; [ "$RUNNER_OS" = Windows ] && delim=';'
          targets=""
          for name in $(env | grep -oE '^JAVA_HOME_[0-9]+_(X64|arm64)=' | tr -d = | sort -t_ -k3 -n); do
            home="${!name}"
            [ -x "$home/bin/$exe" ] || continue
            echo "Found $name: $home"
            targets="${targets:+$targets$delim}$home/bin/$exe"
          done
          # On Linux, 8 (installed above), 11, 17, 21 and 25: missing one there means the run proves
          # less than it claims. Other images carry fewer (macOS arm64 has no 8), listed above.
          if [ "$RUNNER_OS" = Linux ]; then
            for major in 8 11 17 21 25; do
              v="JAVA_HOME_${major}_X64"; test -n "${!v}" || { echo "No Java $major on this image."; exit 1; }
            done
          fi
          build="${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}"
          attach_name="JAVA_HOME_${ATTACHER}_X64"; attach_home="${!attach_name}"
          [ -n "$attach_home" ] || { attach_name="JAVA_HOME_${ATTACHER}_arm64"; attach_home="${!attach_name}"; }
          test -n "$build" || { echo "No JDK 21 on this image."; exit 1; }
          test -n "$attach_home" || { echo "No JDK $ATTACHER on this image."; exit 1; }
          echo "JAVA_HOME=$build" >> "$GITHUB_ENV"
          echo "WIRESCRY_JAVA_TARGETS=$targets" >> "$GITHUB_ENV"
          echo "WIRESCRY_JAVA_ATTACHER=$attach_home/bin/$exe" >> "$GITHUB_ENV"
      - run: npx vitest run test/java-agent-files.test.ts test/java-agent.test.ts test/java-agent-trust.test.ts test/java-agent-proxy.test.ts
        env:
          WIRESCRY_REQUIRE_JAVA: '1'
