name: Java agent

# Wirescry's Java agent (native/java-agent) on every Java GitHub's images carry, plus 8 on Linux,
# loaded at startup and attached. Attaching takes a JDK on Wirescry's side. On Linux and Windows,
# nightly runs try JDK 17, 21 and 25 as the attacher against every target, pull requests JDK 21.
# macOS runs nightly and by hand only, with JDK 17 as the attacher (see the matrix). (Before 17,
# attaching on Linux and macOS can send SIGQUIT to a process that isn't Java; Wirescry needs 17 there.)

on:
  pull_request:
    paths:
      - native/java-agent/**
      - src/backend/java/**
      - src/backend/backend.ts
      - src/shared/terminal-env.ts
      - scripts/build-java-agent.mjs
      - scripts/fetch-java-test-jars.mjs
      - test/java-agent*.ts
      - test/java/**
      - package.json
      - vitest.config.mts
      - .github/workflows/java-agent.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Java versions (${{ matrix.os }}, attacher JDK ${{ matrix.attacher }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub's macOS runners are scarce: jobs waiting for one were cancelled, 10 of 18 (Nov 10-20,
        # 2026) from this workflow's nightly runs, which asked for 12 at once. So pull requests run on
        # Linux and Windows, and macOS runs nightly and by hand (workflow_dispatch, on any branch) with
        # one attacher: 4 macOS jobs, not 12. That one is JDK 17, the oldest Wirescry supports on
        # macOS, and unlike 21 it isn't also the JDK that builds. Linux and Windows try every attacher.
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["ubuntu-latest","windows-latest"]'
          || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        attacher: ${{ fromJSON(github.event_name == 'pull_request' && '["21"]' || '["17","21","25"]') }}
        # Each library's tests on a runner of their own: together, on every Java, they overloaded
        # macOS's 3-core runner (probes too slow to answer). `core` is every other agent test.
        suite: [core, apache, jetty, netty]
        exclude:
          - os: macos-latest
            attacher: '21'
          - os: macos-latest
            attacher: '25'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Byte Buddy and the libraries the tests run the agent against, which come from Maven Central
      # and are checked by their pinned SHA-256 (scripts/build-java-agent.mjs). They're fetched in
      # a step of their own and cached at once, not after the tests: a cache saved when the job
      # ends is saved only if it passes, and the first job to save a key wins, so a key shared
      # with jobs that fetch only Byte Buddy never held the test jars (and Maven Central's 429s
      # and stray 404s failed jetty jobs). Its own key, with every jar in it. After the build
      # script changes, the last cache is restored and only new pins are fetched. Only a run on
      # main (nightly, or by hand) makes the cache every pull request can use.
      - uses: actions/cache/restore@v6
        id: java-deps
        with:
          path: native/java-agent/deps
          key: java-agent-deps-${{ hashFiles('scripts/build-java-agent.mjs') }}
          restore-keys: java-agent-deps-
      - run: node scripts/fetch-java-test-jars.mjs
      - uses: actions/cache/save@v6
        if: steps.java-deps.outputs.cache-hit != 'true'
        with:
          path: native/java-agent/deps
          key: java-agent-deps-${{ hashFiles('scripts/build-java-agent.mjs') }}
      # Ubuntu's image no longer carries Java 8, which programs still run on.
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '8'
      - name: Find the JDKs
        shell: bash
        env:
          ATTACHER: ${{ matrix.attacher }}
        run: |
          # The images name each JDK JAVA_HOME_<major>_<arch>. Build with 21; run on all of them.
          exe=java; [ "$RUNNER_OS" = Windows ] && exe=java.exe
          delim=:; [ "$RUNNER_OS" = Windows ] && delim=';'
          targets=""
          for name in $(env | grep -oE '^JAVA_HOME_[0-9]+_(X64|arm64)=' | tr -d = | sort -t_ -k3 -n); do
            home="${!name}"
            [ -x "$home/bin/$exe" ] || continue
            echo "Found $name: $home"
            targets="${targets:+$targets$delim}$home/bin/$exe"
          done
          # On Linux, 8 (installed above), 11, 17, 21 and 25: missing one there means the run proves
          # less than it claims. Other images carry fewer (macOS arm64 has no 8), listed above.
          if [ "$RUNNER_OS" = Linux ]; then
            for major in 8 11 17 21 25; do
              v="JAVA_HOME_${major}_X64"; test -n "${!v}" || { echo "No Java $major on this image."; exit 1; }
            done
          fi
          build="${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}"
          attach_name="JAVA_HOME_${ATTACHER}_X64"; attach_home="${!attach_name}"
          [ -n "$attach_home" ] || { attach_name="JAVA_HOME_${ATTACHER}_arm64"; attach_home="${!attach_name}"; }
          test -n "$build" || { echo "No JDK 21 on this image."; exit 1; }
          test -n "$attach_home" || { echo "No JDK $ATTACHER on this image."; exit 1; }
          echo "JAVA_HOME=$build" >> "$GITHUB_ENV"
          echo "WIRESCRY_JAVA_TARGETS=$targets" >> "$GITHUB_ENV"
          echo "WIRESCRY_JAVA_ATTACHER=$attach_home/bin/$exe" >> "$GITHUB_ENV"
      # Every test/java-agent*.test.ts file (vitest matches the path's start), across the suites:
      # a new one lands in `core`, so it can't be left out.
      - run: >-
          npx vitest run ${{ matrix.suite == 'core'
          && 'test/java-agent --exclude test/java-agent-apache.test.ts --exclude test/java-agent-jetty.test.ts --exclude test/java-agent-netty.test.ts'
          || format('test/java-agent-{0}.test.ts', matrix.suite) }}
        env:
          WIRESCRY_REQUIRE_JAVA: '1'
