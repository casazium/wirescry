name: Android emulator

# Capture end to end on real Android emulators (test/android-emulator.test.ts), through the
# runner's own ADB server. Nightly, by hand, and on pull requests that touch Android code. Not a
# required check: emulators take minutes to boot and can be flaky.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/backend/android/**'
      - 'src/backend/device-listeners.ts'
      - 'src/backend/egress-guard.ts'
      - 'test/android-*.ts'
      - 'test/fake-adb.ts'
      - '.github/workflows/android-emulator.yml'

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 24: the oldest Wirescry supports (shell v2 with stdin, copying the certificate).
        # 28: tunnels made as tcp:<port> (adbd binds loopback anyway before Android 11).
        # 35: tunnels made as tcp:localhost:<port>, checked with ss.
        api: [24, 28, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # x86_64 images run with KVM, which GitHub's Ubuntu runners have but don't open to the user.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: WIRESCRY_ANDROID_DEVICE=emulator-5554 npx vitest run test/android-emulator.test.ts
