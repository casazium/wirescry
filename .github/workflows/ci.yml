name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand, e.g. when GitHub loses a run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Windows also pulls a Windows container image for test/docker-windows.test.ts.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # The Docker pipe helper (Go), which Windows ships. Off Windows it uses Unix sockets, so the
      # relay's tests run through it everywhere; the Windows ones are cross-built here too, so a
      # change that breaks them shows on every OS.
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/docker-pipe/go.mod
          cache-dependency-path: native/docker-pipe/go.sum
      - name: Check the Docker pipe helper
        shell: bash
        working-directory: native/docker-pipe
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Not gofmt-formatted (above)."; exit 1; }
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build -o "$RUNNER_TEMP/docker-pipe-arm64.exe" .
          # The race detector needs a C compiler, which only the macOS and Linux images have set up.
          if [ "$RUNNER_OS" = Windows ]; then go test -count=1 -v ./...; else go test -race -count=1 ./...; fi
      - run: node scripts/build-docker-pipe.mjs
      # The Java agent's tests (test/java-agent*.test.ts) build it with a JDK 17+ and run it.
      # GitHub's images carry several JDKs; use their JDK 21 whatever JAVA_HOME says (Windows'
      # default is 8). .github/workflows/java-agent.yml runs the agent on every Java from 8 to 25.
      - name: Use JDK 21
        shell: bash
        run: |
          jdk="${JAVA_HOME_21_X64:-$JAVA_HOME_21_arm64}"
          test -n "$jdk" || { echo "This runner image has no JDK 21."; exit 1; }
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
      # GitHub's Windows images have Docker, but its service isn't always running yet.
      - name: Start Docker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $service) { throw "This runner has no Docker service, which test/docker-windows.test.ts needs." }
          if ($service.Status -ne 'Running') { Start-Service docker }
          $deadline = (Get-Date).AddMinutes(2)
          while (-not (Test-Path '\\.\pipe\docker_engine')) {
            if ((Get-Date) -gt $deadline) { throw "Docker didn't start within 2 minutes." }
            Start-Sleep -Seconds 2
          }
          docker version
      - run: npm test
        env:
          # The Docker relay against the runner's real Docker, over named pipes (Windows only).
          WIRESCRY_WINDOWS_DOCKER_E2E: ${{ matrix.os == 'windows-latest' && '1' || '' }}
          # Tests that need the helper fail instead of skipping without it.
          WIRESCRY_REQUIRE_PIPE_HELPER: '1'
          # And the Java agent's, without a JDK.
          WIRESCRY_REQUIRE_JAVA: '1'

  electron:
    # The backend's tests under Electron's own Node, as the app runs them. It uses BoringSSL, not
    # OpenSSL, and words TLS errors differently: plain Node missed a bug that came from that.
    name: Electron runtime (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # The Docker relay's tests skip here without the pipe helper; the check job runs them.
      - run: npm run test:electron

  smoke:
    # The free app, built and driven end to end (e2e/smoke.test.ts). Release builds run the
    # same test against each packaged app, with Pro.
    name: Smoke test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Electron needs a display; the hosted runners have Xvfb.
      - run: xvfb-run -a npm run smoke
