name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Windows also pulls a Windows container image for test/docker-windows.test.ts.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # GitHub's Windows images have Docker, but its service isn't always running yet.
      - name: Start Docker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if (-not $service) { throw "This runner has no Docker service, which test/docker-windows.test.ts needs." }
          if ($service.Status -ne 'Running') { Start-Service docker }
          $deadline = (Get-Date).AddMinutes(2)
          while (-not (Test-Path '\\.\pipe\docker_engine')) {
            if ((Get-Date) -gt $deadline) { throw "Docker didn't start within 2 minutes." }
            Start-Sleep -Seconds 2
          }
          docker version
      - run: npm test
        env:
          # The Docker relay against the runner's real Docker, over named pipes (Windows only).
          WIRESCRY_WINDOWS_DOCKER_E2E: ${{ matrix.os == 'windows-latest' && '1' || '' }}

  smoke:
    # The free app, built and driven end to end (e2e/smoke.test.ts). Release builds run the
    # same test against each packaged app, with Pro.
    name: Smoke test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Electron needs a display; the hosted runners have Xvfb.
      - run: xvfb-run -a npm run smoke
