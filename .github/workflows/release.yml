name: Release

# Builds installers for macOS, Windows and Linux (x64 and arm64).
#
# - Pushing a tag like v0.2.0 builds, signs (when the secrets exist) and uploads to a
#   draft release on casazium/wirescry-releases. Publish the draft on GitHub to ship it.
# - Pull requests that touch packaging build Linux only, without publishing, and keep
#   the installer as a workflow artifact for three days. Manual runs build every platform,
#   and keep theirs for one day.
#
# Signing is skipped, with a warning, for any platform whose secrets aren't set yet.
# See docs/RELEASING.md for the secrets and variables.
#
# Pro: the build checks out casazium/wirescry-pro (read-only, through the org's
# "wirescry-ci" GitHub App) at one commit for every platform, compiles Pro's backend to
# V8 bytecode for each CPU type, and checks each packaged app loads it. Tags must include
# Pro; manual runs include it when CI_APP_ID and CI_APP_PRIVATE_KEY are set. Pull
# requests never do, so a workflow change in a PR can't reach Pro's source.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron-builder.cjs'
      - 'build/**'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'scripts/pro-bytecode/**'
      - 'scripts/third-party-notices.mjs'
      - 'scripts/self-test-packaged.mjs'
      - 'e2e/**'
      - 'scripts/notarize-dmg.cjs'
      - 'src/main/**'
  workflow_dispatch:
    inputs:
      pro_ref:
        description: 'Pro branch, tag or commit to build in (default: main)'
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pro:
    name: Pick the Pro commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Empty for a build without Pro.
      sha: ${{ steps.pick.outputs.sha }}
    env:
      HAS_PRO_ACCESS: ${{ github.event_name != 'pull_request' && vars.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check Pro can be included
        if: env.IS_TAG == 'true' && env.HAS_PRO_ACCESS != 'true'
        run: |
          echo "::error::Releases must include Pro, but the CI_APP_ID variable or CI_APP_PRIVATE_KEY secret isn't set. See docs/RELEASING.md."
          exit 1

      - name: Get a read-only token for Pro
        id: pro-token
        if: env.HAS_PRO_ACCESS == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: casazium
          repositories: wirescry-pro
          permission-contents: read

      - name: Check out Pro
        if: env.HAS_PRO_ACCESS == 'true'
        uses: actions/checkout@v7
        with:
          repository: casazium/wirescry-pro
          ref: ${{ inputs.pro_ref || 'main' }}
          path: wirescry-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      # electron-builder creates the draft on its first upload if there isn't one, with no
      # lock: two builds finishing together (the two Linux CPUs do) could each create one
      # and split the files. Making it here, before any build, gives them one to share. It
      # matches by tag; the title and target are what electron-builder would use.
      - name: Create the draft release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASES_TOKEN: the builds won't upload, so no draft is needed."
            exit 0
          fi
          repo=casazium/wirescry-releases
          tag="$GITHUB_REF_NAME"
          existing="$(gh api "repos/$repo/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")] | length")"
          if [ "$existing" -gt 0 ]; then
            echo "A release for $tag already exists."
          else
            gh release create "$tag" -R "$repo" --draft --title "${tag#v}" --target main --notes ""
          fi

      - name: Pick the commit
        id: pick
        run: |
          if [ -d wirescry-pro ]; then
            sha="$(git -C wirescry-pro rev-parse HEAD)"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Pro: casazium/wirescry-pro@$sha" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pro: not included (free build)" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: pro
    strategy:
      fail-fast: false
      matrix:
        # Packaging PRs build Linux only. It catches nearly all packaging
        # breakage, and the hosted runners are not priced alike: macOS is
        # 10x Linux's rate and Windows 2x. Every hosted macOS minute this
        # org spent in October came from PR runs of this workflow - none
        # from a release - so this is where that cost lives. Tags and
        # manual runs still build all three, so nothing about how a
        # release is built or signed changes.
        #
        # Windows builds on Arm: Pro's bytecode must be compiled by Electron for each CPU
        # type, and Windows on Arm can run both arm64 and (emulated) x64 Electron, while
        # x64 Windows can't run arm64. The macOS runners are Apple silicon, with Rosetta.
        # Linux can't run another CPU's Electron, so it builds on one runner per CPU: x64,
        # and arm64 (free, like x64 Linux, for a public repo). Each packages its own CPU.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "ubuntu-24.04-arm"]') || fromJSON('["macos-latest", "windows-11-arm", "ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    # Windows on Arm runners have 2 cores, and build x64 emulated.
    timeout-minutes: 90
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASES_TOKEN != '' }}
      HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' }}
      PRO_SHA: ${{ needs.pro.outputs.sha }}
      # electron-builder.cjs then refuses to package a release without Pro.
      WIRESCRY_REQUIRE_PRO: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Electron 45 runs Node 24.
          node-version: 24
          cache: npm

      - run: npm ci

      # The x64 Linux image has Xvfb, for Electron's display; make sure the arm64 one does.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. The updater compares versions, so they must agree."
            exit 1
          fi

      - name: Get a read-only token for Pro
        id: pro-token
        if: env.PRO_SHA != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: casazium
          repositories: wirescry-pro
          permission-contents: read

      - name: Check out Pro
        if: env.PRO_SHA != ''
        uses: actions/checkout@v7
        with:
          repository: casazium/wirescry-pro
          ref: ${{ env.PRO_SHA }}
          path: wirescry-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Build the app
        shell: bash
        run: |
          # The build's release date, which Pro compares with a lapsed subscription's end
          # (its perpetual fallback): the later of the app's and Pro's commit dates, so a
          # rebuild gets the same one, and a Pro-only change still counts as new.
          WIRESCRY_RELEASE_DATE="$(git log -1 --format=%cI)"
          if [ -d wirescry-pro ]; then
            WIRESCRY_RELEASE_DATE="$(node -e 'console.log(new Date(Math.max(...process.argv.slice(1).map(Date.parse))).toISOString())' "$WIRESCRY_RELEASE_DATE" "$(git -C wirescry-pro log -1 --format=%cI)")"
          fi
          export WIRESCRY_RELEASE_DATE
          echo "Release date: $WIRESCRY_RELEASE_DATE"
          if [ -d wirescry-pro ]; then
            export WIRESCRY_PRO_DIR="$PWD/wirescry-pro"
            echo "Building with Pro at $(git -C wirescry-pro rev-parse HEAD)"
          else
            echo "Building the free app, without Pro"
          fi
          npm run build
          if [ -n "${WIRESCRY_PRO_DIR:-}" ]; then
            # Every architecture electron-builder.cjs packages for this platform.
            case "$RUNNER_OS" in
              macOS) arches=arm64,x64 ;;
              Windows) arches=x64,arm64 ;;
              *) if [ "$RUNNER_ARCH" = "ARM64" ]; then arches=arm64; else arches=x64; fi ;;
            esac
            # Electron needs a display on Linux; the hosted runners have Xvfb.
            run=""
            if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
            $run node scripts/pro-bytecode/compile.mjs --arch "$arches"
          fi

      # Drives the built app end to end, with Pro in a Pro build, on this runner's OS and CPU:
      # captures traffic, opens gzip and HTML bodies, kills the backend and checks the list and
      # the Pro tab survive (e2e/smoke.test.ts). It runs the build in out/ before packaging:
      # Playwright attaches with --inspect, which the packaged app's fuses turn off on purpose.
      # The packaged apps get the self-test below instead.
      - name: Smoke test the built app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke
          else
            npm run smoke
          fi

      - name: Set up macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$HAS_MAC_CERT" != "true" ]; then
            echo "::warning::macOS build is unsigned: CSC_LINK and CSC_KEY_PASSWORD aren't set."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # Import the certificate into a keychain of our own, and point electron-builder at
          # the identity in it. electron-builder's own import (from CSC_LINK) fails on
          # current macOS runners: it can't unlock the keychain it makes.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert_file="$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_file"
          if ! security import "$cert_file" -k "$keychain" -f pkcs12 -P "$CSC_KEY_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$cert_file"
            echo "::error::Couldn't import the signing certificate: check CSC_LINK (a base64 .p12) and CSC_KEY_PASSWORD."
            exit 1
          fi
          rm -f "$cert_file"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Search our keychain first, then the usual ones (for Apple's intermediates).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::The certificate in CSC_LINK isn't a Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "Signing as: Developer ID Application: $identity"
          # electron-builder takes the name without the "Developer ID Application: " prefix.
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ "$HAS_APPLE_API_KEY" != "true" ]; then
            echo "::warning::macOS build is signed but not notarized: the Apple API key secrets aren't set."
            exit 0
          fi
          # electron-builder expects APPLE_API_KEY to be a path to the .p8 file.
          key_file="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_file"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Set up Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ "$HAS_AZURE" != "true" ]; then
            echo "::warning::Windows build is unsigned: the Azure secrets or the AZURE_SIGNING_ENDPOINT variable aren't set."
            exit 0
          fi
          {
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "AZURE_SIGNING_ENDPOINT=${{ vars.AZURE_SIGNING_ENDPOINT }}"
            echo "AZURE_SIGNING_ACCOUNT=${{ vars.AZURE_SIGNING_ACCOUNT }}"
            echo "AZURE_SIGNING_PROFILE=${{ vars.AZURE_SIGNING_PROFILE }}"
            echo "AZURE_SIGNING_PUBLISHER=${{ vars.AZURE_SIGNING_PUBLISHER }}"
          } >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          # Used only to upload to casazium/wirescry-releases; never built into the app.
          GH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.RELEASES_TOKEN || '' }}
          # The Windows setup unpacks with an NSIS 7-Zip plugin that can't read 7-Zip's
          # ARM64 filter, which 7-Zip picks for ARM64 executables. It skipped every .exe
          # and .dll, so ARM PCs got an app with no Wirescry.exe. BCJ2 is the filter the
          # x64 package already used.
          ELECTRON_BUILDER_7Z_FILTER: ${{ runner.os == 'Windows' && 'BCJ2' || '' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then publish=always; else publish=never; fi
          npx electron-builder --publish "$publish"

      # Starts each packaged app without a window and checks it runs and, in a Pro build,
      # that Pro loaded. On a tag this runs after the upload; the release is still a
      # draft, so if it fails, delete the draft rather than publishing it. The same goes
      # for a failed Package step (for example a .dmg Apple refused to notarize), which
      # can leave a draft holding only some of the files.
      - name: Check the packaged apps start
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node scripts/self-test-packaged.mjs
          else
            node scripts/self-test-packaged.mjs
          fi

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: wirescry-${{ runner.os }}-${{ runner.arch }}
          # Three days for a pull request, one for anything else. A packaging
          # PR builds Linux only (~225MB) and a reviewer may not get to it
          # until Monday, so three days earns its keep there. Everything else
          # builds every platform - about 1.15GB with arm64 Linux - and does not need
          # them: a workflow_dispatch was triggered by someone who is looking
          # now, and a tag push has already published the installers to
          # casazium/wirescry-releases through electron-builder, so the
          # artifact is a redundant second copy.
          #
          # Measured on 2026-10-25: one dispatch run on main held 930MB for
          # three days, which was more Actions storage than every other
          # artifact in the organisation combined and pushed the account to
          # 107% of its 0.5GB included allowance. Storage is billed as a
          # time-integrated average, so the cost is size x days - which is
          # why this knob matters more than it looks.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 1 }}
          if-no-files-found: error
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.AppImage
            release/*/*.deb
            release/*/latest*.yml

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  # The Windows build runs on Arm, so its installer test only ever unpacks the setup's
  # arm64 package. This installs the same setup on an x64 runner, which unpacks the x64
  # package, and starts the installed app; Pro's x64 bytecode runs natively here too.
  install-x64:
    name: Install on x64 Windows
    needs: [pro, build]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the Windows installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n wirescry-Windows-ARM64 -D release

      - name: Install the setup and start the installed app
        shell: bash
        env:
          WIRESCRY_EXPECT_PRO: ${{ needs.pro.outputs.sha != '' && '1' || '' }}
        run: node scripts/self-test-packaged.mjs
